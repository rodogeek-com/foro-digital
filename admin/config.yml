backend:
  name: github
  repo: rodogeek-com/foro-digital
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  - name: "events"
    label: "Eventos"

    folder: "content/events"

    create: true

    slug: "{{slug}}"

    fields:

      - { label: "Título", name: "title", widget: "string" }

      - { label: "Fecha", name: "date", widget: "datetime" }

      - { label: "País", name: "country", widget: "string" }

      - { label: "Speaker", name: "speaker", widget: "string" }

      - { label: "Registro", name: "registration", widget: "string" }

      - { label: "Descripción", name: "body", widget: "markdown" }

  - name: "speakers"
    label: "Speakers"

    folder: "content/speakers"

    create: true

    slug: "{{slug}}"

    fields:

      - { label: "Nombre", name: "name", widget: "string" }

      - { label: "País", name: "country", widget: "string" }

      - { label: "LinkedIn", name: "linkedin", widget: "string" }

      - { label: "Temas", name: "topics", widget: "string" }

      - { label: "Biografía", name: "body", widget: "markdown" }

   - name: "chapters"
    label: "Capítulos"

    folder: "content/chapters"

    create: true

    slug: "{{slug}}"

    fields:

      - { label: "País", name: "country", widget: "string" }

      - {
          label: "Estado",
          name: "status",
          widget: "select",
          options:
            [
              "Recruiting",
              "Pending",
              "Active",
              "Paused"
            ]
        }

      - { label: "Líder", name: "leader", widget: "string" }

      - { label: "Speakers", name: "speakers", widget: "number", default: 0 }

      - { label: "Eventos", name: "events", widget: "number", default: 0 }

      - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }

  - name: "recordings"
    label: "Grabaciones"

    folder: "content/recordings"

    create: true

    slug: "{{slug}}"

    fields:

      - { label: "Título", name: "title", widget: "string" }

      - { label: "YouTube", name: "youtube", widget: "string" }

      - { label: "Speaker", name: "speaker", widget: "string" }

  - name: "sponsors"
    label: "Patrocinadores"

    folder: "content/sponsors"

    create: true

    slug: "{{slug}}"

    fields:

      - { label: "Empresa", name: "company", widget: "string" }

      - { label: "Tipo", name: "type", widget: "string" }

      - { label: "URL", name: "url", widget: "string" }

  - name: "leaders"
    label: "Líderes"

    folder: "content/leaders"

    create: true

    slug: "{{slug}}"

    fields:

      - { label: "Nombre", name: "name", widget: "string" }

      - { label: "País", name: "country", widget: "string" }

      - { label: "Ciudad", name: "city", widget: "string" }

      - { label: "LinkedIn", name: "linkedin", widget: "string" }

      - { label: "Correo", name: "email", widget: "string" }

      - { label: "Foto", name: "photo", widget: "image", required: false }

      - {
          label: "Estado",
          name: "status",
          widget: "select",
          options:
            [
              "Aplicó",
              "En revisión",
              "Aprobado",
              "Activo",
              "Inactivo"
            ]
        }

      - {
          label: "Biografía",
          name: "bio",
          widget: "markdown",
          required: false
        }
